apiVersion: keycloak.org/v1alpha1
kind: Keycloak
metadata:
  labels:
    app: sso
  name: keycloak
  namespace: ${KEYCLOAK_NAMESPACE}
spec:
  externalAccess:
    enabled: true
  instances: 1
  keycloakDeploymentSpec:
    imagePullPolicy: Always
  postgresDeploymentSpec:
    imagePullPolicy: Always
---
apiVersion: keycloak.org/v1alpha1
kind: KeycloakRealm
metadata:
  labels:
    app: sso
  name: trusted-artifact-signer
  namespace: ${KEYCLOAK_NAMESPACE}
spec:
  instanceSelector:
    matchLabels:
      app: sso
  realm:
    displayName: Red-Hat-Trusted-Artifact-Signer
    enabled: true
    id: trusted-artifact-signer
    realm: trusted-artifact-signer
    sslRequired: none
---
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  labels:
    app: sso
  name: trusted-artifact-signer
  namespace: ${KEYCLOAK_NAMESPACE}
spec:
  client:
    attributes:
      request.object.signature.alg: RS256
      user.info.response.signature.alg: RS256
    clientAuthenticatorType: client-secret
    clientId: trusted-artifact-signer
    defaultClientScopes:
    - profile
    - email
    description: Client for Red Hat Trusted Artifact Signer authentication
    directAccessGrantsEnabled: true
    implicitFlowEnabled: false
    name: trusted-artifact-signer
    protocol: openid-connect
    protocolMappers:
    - config:
        claim.name: email
        id.token.claim: "true"
        jsonType.label: String
        user.attribute: email
        userinfo.token.claim: "true"
      name: email
      protocol: openid-connect
      protocolMapper: oidc-usermodel-property-mapper
    - config:
        claim.name: email-verified
        id.token.claim: "true"
        user.attribute: emailVerified
        userinfo.token.claim: "true"
      name: email-verified
      protocol: openid-connect
      protocolMapper: oidc-usermodel-property-mapper
    - config:
        claim.name: aud
        claim.value: trusted-artifact-signer
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
      name: audience
      protocol: openid-connect
      protocolMapper: oidc-hardcoded-claim-mapper
    publicClient: true
    standardFlowEnabled: true
    redirectUris:
    - "*"
  realmSelector:
    matchLabels:
      app: sso
---
apiVersion: keycloak.org/v1alpha1
kind: KeycloakUser
metadata:
  labels:
    app: sso
  name: ${SIGNER_USERNAME}
  namespace: ${KEYCLOAK_NAMESPACE}
spec:
  realmSelector:
    matchLabels:
      app: sso
  user:
    email: ${SIGNER_EMAIL}
    enabled: true
    emailVerified: true
    credentials:
    - type: "password"
      value: "${SIGNER_PASSWORD}"
    firstName: ${SIGNER_FIRST_NAME}
    lastName: ${SIGNER_LAST_NAME}
    username: ${SIGNER_USERNAME}
---
apiVersion: keycloak.org/v1alpha1
kind: KeycloakUser
metadata:
  labels:
    app: sso
  name: ${WRONG_IDENTITY_USERNAME}
  namespace: ${KEYCLOAK_NAMESPACE}
spec:
  realmSelector:
    matchLabels:
      app: sso
  user:
    email: ${WRONG_IDENTITY_EMAIL}
    enabled: true
    emailVerified: true
    credentials:
    - type: "password"
      value: "${WRONG_IDENTITY_PASSWORD}"
    firstName: Wrong
    lastName: Identity
    username: ${WRONG_IDENTITY_USERNAME}
